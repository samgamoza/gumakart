# Deploys Guma Kart to Cloudflare Workers:
#   web       -> kart.guma.one   (gumakart-web)
#   admin     -> admin.guma.one  (gumakart-admin, also runs the crons)
#   platform  -> ops.guma.one    (gumakart-platform)
#
# Why CI and not a Windows build: @opennextjs/cloudflare writes Windows paths
# (".next\routes-manifest.json") into the bundle when it builds on Windows, so
# every request fails with a 500. Building on Linux (this runner) is correct.
#
# Repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   same token as scripts/deploy-cloudflare.ps1
#   CLOUDFLARE_ACCOUNT_ID  optional, defaults below
# Optional repo variables (public browser keys): NEXT_PUBLIC_GOOGLE_MAPS_API_KEY,
#   NEXT_PUBLIC_PAYMONGO_PUBLIC_KEY, NEXT_PUBLIC_SUPPORT_EMAIL
# Runtime secrets (DATABASE_URL_POOLED, AUTH_SECRET, CRON_SECRET, ...) live on the
# Workers, uploaded by scripts/deploy-cloudflare.ps1, and survive redeploys.
name: Deploy Guma Kart (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app"
        type: choice
        options: [all, web, admin, platform]
        default: all
      skip_schema_check:
        description: "Deploy even if Neon is missing a migration (emergencies only)"
        type: boolean
        default: false
  push:
    branches: [main, master, "wip/**"]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  # Security G4 (GK-22): nothing deploys unless it typechecks, its unit tests pass, production
  # dependencies carry no critical advisory and no secret is committed.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11a390b2fc2d8b6ad1e4f4b0b5b7 # v4.3.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development
      - name: Typecheck
        run: pnpm -r --filter "./apps/*" --if-present typecheck && pnpm --filter @gumakart/db --filter @gumakart/services --filter @gumakart/auth exec tsc --noEmit -p .
      - name: Unit tests
        run: pnpm -r --filter "./packages/*" --filter "./apps/*" --if-present test
      - name: Route auth audit
        run: node --test scripts/route-audit.test.mjs
      - name: Dependency audit (production, critical)
        run: pnpm audit --prod --audit-level=critical
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            host: kart.guma.one
            smoke: "/kart /"
          - app: admin
            host: admin.guma.one
            smoke: "/login"
          - app: platform
            host: ops.guma.one
            smoke: "/login"
    concurrency:
      group: deploy-${{ matrix.app }}
      # Security G4 (GK-22): a newer push waits instead of cancelling, so the three apps never end on different versions.
      cancel-in-progress: false
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_STOREFRONT_URL: https://kart.guma.one
      NEXT_PUBLIC_ADMIN_URL: https://admin.guma.one
      NEXT_PUBLIC_PLATFORM_URL: https://ops.guma.one
      NEXT_PUBLIC_ROOT_DOMAIN: guma.one
      NEXT_PUBLIC_PLAN_BILLING_ENABLED: "false"
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_PAYMONGO_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_PAYMONGO_PUBLIC_KEY }}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
      # wrangler/OpenNext start a local emulator during deploy and insist on a local
      # Postgres URL for every Hyperdrive binding. It's never connected to; the real
      # Hyperdrive (gumakart-db -> Neon) is used once deployed.
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Skip if another app was picked
        id: pick
        run: |
          want="${{ github.event.inputs.app || 'all' }}"
          if [ "$want" = "all" ] || [ "$want" = "${{ matrix.app }}" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@34e114876b0b11a390b2fc2d8b6ad1e4f4b0b5b7 # v4.3.1
        if: steps.pick.outputs.run == 'true'

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        if: steps.pick.outputs.run == 'true'
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.pick.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      # Phase 19: every API route has an auth guard (or a reasoned public entry).
      - name: Route auth audit
        if: steps.pick.outputs.run == 'true'
        run: node --test scripts/route-audit.test.mjs

      # Phase 19: never ship code ahead of its migration. The live admin app shares the database,
      # so it can say whether Neon already has the newest migration in this commit. No DB
      # credentials are needed here. Run `pnpm db:migrate` (DATABASE_URL = Neon) to fix a failure.
      - name: Database has this commit's migrations
        if: steps.pick.outputs.run == 'true' && github.event.inputs.skip_schema_check != 'true'
        run: |
          read -r tag when < <(node -e "const j=require('./packages/db/drizzle/meta/_journal.json');const e=j.entries.at(-1);console.log(e.tag, e.when)")
          resp=$(curl -s -w '\n%{http_code}' "https://admin.guma.one/api/health/schema?when=$when" || true)
          code=$(echo "$resp" | tail -n1); body=$(echo "$resp" | head -n -1)
          echo "newest migration in this commit: $tag ($when) -> HTTP $code $body"
          if [ "$code" = "404" ]; then echo "::warning::The live app doesn't have the schema check yet (first deploy with it). Make sure $tag is applied on Neon."; exit 0; fi
          if echo "$body" | grep -q '"applied":true'; then exit 0; fi
          if [ "$code" = "200" ]; then echo "::error::Neon is missing migration $tag. Run 'pnpm db:migrate' against Neon, then re-run this workflow."; exit 1; fi
          echo "::warning::Couldn't check the schema (HTTP $code). Deploying anyway; confirm $tag is applied on Neon."

      - name: Install
        if: steps.pick.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development   # devDependencies (opennext, wrangler) are needed for the build

      - name: Build (OpenNext)
        if: steps.pick.outputs.run == 'true'
        working-directory: apps/${{ matrix.app }}
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy
        if: steps.pick.outputs.run == 'true'
        working-directory: apps/${{ matrix.app }}
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '14e2cde158da2d561d055949bf5a3f19' }}

      - name: Smoke test
        if: steps.pick.outputs.run == 'true'
        run: |
          sleep 10
          fail=0
          for p in ${{ matrix.smoke }}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ matrix.host }}$p")
            echo "https://${{ matrix.host }}$p -> $code"
            if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then fail=1; fi
          done
          exit $fail
